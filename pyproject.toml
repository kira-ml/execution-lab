[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-lab"
version = "0.1.0"
description = "Transparent execution-cost and market-impact laboratory for ETF portfolios"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ken Ira Lacson Talingting" }]
keywords = [
    "quantitative finance",
    "execution",
    "market impact",
    "transaction costs",
    "portfolio construction",
    "reproducibility",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "matplotlib>=3.8,<4",
    "pyarrow>=15.0,<22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
execution-lab = "execution_lab.cli:main"

[project.urls]
Repository = "https://github.com/kira-ml/execution-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::FutureWarning",
]
